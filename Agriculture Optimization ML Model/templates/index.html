<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agriculture Optimization</title>
</head>
<body>
    <h1>Agriculture Optimization App</h1>
    <form id="predictionForm">
        <input type="number" id="n" placeholder="N" required>
        <input type="number" id="p" placeholder="P" required>
        <input type="number" id="k" placeholder="K" required>
        <input type="number" id="temperature" placeholder="Temperature" required>
        <input type="number" id="humidity" placeholder="Humidity" required>
        <input type="number" id="ph" placeholder="pH" required>
        <input type="number" id="rainfall" placeholder="Rainfall" required>
        <button type="submit">Predict Crop</button>
    </form>
</body>
</html>
